name: Build STORY GPT Editor APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-editor/**'
      - 'css/style.css'
      - 'js/views.js'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android-editor/**'
      - 'css/style.css'
      - 'js/views.js'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: STORY-GPT-Editor-APK
          path: android-editor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
